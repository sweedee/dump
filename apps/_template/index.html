<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111118" />
  <title>{{title}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{emoji}}</text></svg>" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111118; color: #f1f0f7; font: 16px/1.4 system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
    a { color: #ff8c42; }
  </style>
</head>
<body>
  <main>
    <h1>{{emoji}} {{title}}</h1>
    <p>New prototype. Go wild.</p>
    <p><a href="../">← all prototypes</a></p>
  </main>
  <script type="module">
    // your dumb idea here
  </script>
</body>
</html>
